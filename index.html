<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizMate - AI 경영 어드바이저</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1e88e5;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .auth-box {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      font-family: Arial, sans-serif;
    }

    input {
      height: 46px;
    }

    textarea {
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .login-btn {
      background: #42a5f5;
      color: white;
    }

    .signup-btn {
      background: #7e57c2;
      color: white;
    }

    .logout-btn {
      background: #455a64;
      color: white;
    }

    .add-btn {
      background: #42a5f5;
      color: white;
      height: auto;
      padding: 15px;
    }

    .refresh-btn {
      background: #66bb6a;
      color: white;
      margin-bottom: 16px;
    }

    .tts-btn {
      background: #26a69a;
      color: white;
      height: 36px;
      font-size: 13px;
    }

    .delete-btn {
      background: #ef5350;
      color: white;
    }

    .form-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
      background: #f7f9fb;
      padding: 20px;
      border-radius: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f9fb;
    }

    .user-info {
      font-size: 14px;
      color: #555;
      word-break: break-all;
    }

    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: #555;
      font-size: 14px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-b: 1px dashed #ddd;
      padding-bottom: 8px;
    }

    .item-title {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #1565c0;
    }

    .item-content {
      margin: 0;
      color: #333;
      line-height: 1.6;
      word-break: break-all;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      white-space: pre-wrap;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-date {
      font-size: 12px;
      color: #999;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      background: #f7f9fb;
      border-radius: 16px;
    }

    .hidden {
      display: none;
    }

    .notice {
      max-width: 620px;
      margin: 20px auto 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BizMate : AI 경영 리포트</h1>
    <div class="subtitle">나만의 경영 어드바이저 & 컨설팅 관리 히스토리</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>경영인 로그인</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>

      <div class="notice">
        처음 사용하는 이메일은 회원가입을 먼저 누르세요.<br />
        이미 가입한 이메일은 로그인 버튼을 누르면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">
          접속 계정: <strong id="userEmail"></strong>
        </div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="form-box">
        <h2>💡 새로운 경영 컨설팅 요청</h2>
        <input id="titleInput" type="text" placeholder="고민 한 줄 요약 (예: 원자재 인상 대응 전략)" />
        <textarea id="contentInput" rows="4" placeholder="AI 분석관에게 전달할 세부 경영 상황을 입력하세요..."></textarea>
        <button class="add-btn" id="addBtn">AI 컨설팅 리포트 생성 및 저장</button>
      </div>

      <button class="refresh-btn" id="refreshBtn">히스토리 불러오기</button>
      <div id="status" class="status"></div>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    // 지정해주신 Firebase SDK 10.12.2 버전 유지
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onValue,
      off
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 지정해주신 프로젝트의 Firebase 정보 셋팅
    const firebaseConfig = {
      apiKey: "AIzaSyA4T6HhnvZsesbGco9rzhprUz2AbG8NnRs",
      authDomain: "project-dcdba.firebaseapp.com",
      databaseURL: "https://project-dcdba-default-rtdb.firebaseio.com",
      projectId: "project-dcdba",
      storageBucket: "project-dcdba.firebasestorage.app",
      messagingSenderId: "572244909257",
      appId: "1:572244909257:web:cd9b3fb67c4697dfac4118",
      measurementId: "G-JTBN1WZELW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Apps Script 웹앱 배포 URL 주소를 이곳에 적어주세요.
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyuJs0JzZoMG2qnfRe7z64jJOkXsz9MsiZ8KOY3ATD0nwko1VsolpbQ5ty0UYckqAl/exec";

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');

    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const userEmail = document.getElementById('userEmail');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getEmailAndPassword() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return null;
      }

      if (password.length < 6) {
        alert('비밀번호는 6자리 이상이어야 합니다.');
        return null;
      }

      return { email, password };
    }

    // 회원가입 이벤트
    signupBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;

      try {
        await createUserWithEmailAndPassword(auth, account.email, account.password);
        alert('회원가입이 완료되었습니다.');
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    // 로그인 이벤트
    loginBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;

      try {
        await signInWithEmailAndPassword(auth, account.email, account.password);
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    // 로그아웃 이벤트
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert('로그아웃에 실패했습니다.');
      }
    });

    // 유저 상태 감지 감시자
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        showMainPage(user);
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        showAuthPage();
        stopRealtimeDataListener();
      }
    });

    function showMainPage(user) {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      userEmail.textContent = user.email;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showAuthPage() {
      authSection.classList.remove('hidden');
      mainSection.classList.add('hidden');
      userEmail.textContent = '';
      dataList.innerHTML = '';
    }

    // 실시간 파이어베이스 리스너 스타트
    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('경영 데이터 분석 기록을 불러오는 중입니다...');

      currentItemsRef = ref(database, `users/${uid}/items`);

      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        setStatus('경영 히스토리가 실시간으로 동기화되었습니다.');
      }, (error) => {
        console.error(error);
        setStatus('데이터 동기화 실패. 파이어베이스 권한을 확인하세요.');
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    addBtn.addEventListener('click', generateAIAndSaveData);
    refreshBtn.addEventListener('click', () => {
      if (currentUser) {
        startRealtimeDataListener(currentUser.uid);
      }
    });

    // 핵심 로직: 생성형 AI 호출 후 파이어베이스 실시간 저장 통합본
    async function generateAIAndSaveData() {
      if (!currentUser) {
        alert('로그인이 필요합니다.');
        return;
      }

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) {
        alert('제목과 질문하실 경영 상황 내용을 모두 입력해주세요.');
        return;
      }

      addBtn.innerText = "🚀 AI 경영 분석 전문가가 리포트를 작성 중입니다...";
      addBtn.disabled = true;

      try {
        // 1. Google Apps Script 프록시 호출
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ 
            prompt: `당신은 유능한 대기업 최고경영자(CEO)이자 비즈니스 컨설턴트입니다. 다음 상황에 대해 실행 가능한 핵심 경영 전략과 해결책을 구체적으로 답변해 주세요. \n[주제]: ${title} \n[상황 상황]: ${content}` 
          })
        });
        
        const data = await response.json();
        const aiResponseText = data.text || "AI 분석 결과를 가져오는 데 실패했습니다.";

        // 2. 파이어베이스 실시간 데이터베이스 보관함에 결과 누적 저장
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);

        await set(newItemRef, {
          title: title,
          content: aiResponseText, // 원본 내용 대신 AI의 종합 피드백 결과를 보관함에 보관
          createdAt: new Date().toLocaleString('ko-KR')
        });

        titleInput.value = '';
        contentInput.value = '';
        alert('AI 컨설팅 리포트 발급 및 히스토리 저장이 완료되었습니다!');
      } catch (error) {
        console.error(error);
        alert('AI 연동 처리 중 문제가 발생했습니다. Apps Script 주소 및 세팅을 점검하세요.');
      } finally {
        addBtn.innerText = "AI 컨설팅 리포트 생성 및 저장";
        addBtn.disabled = false;
      }
    }

    // 데이터 영구 삭제
    window.deleteData = async function(id) {
      if (!currentUser) return;

      const isConfirmed = confirm('작성된 비즈니스 리포트를 히스토리에서 정말 삭제하시겠습니까?');
      if (!isConfirmed) return;

      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (error) {
        console.error(error);
        alert('리포트 삭제에 실패했습니다.');
      }
    };

    // 브라우저 내장 TTS 음성 재생 엔진 함수 구현
    window.speakReport = function(id) {
      const contentText = document.getElementById(`content-text-${id}`).innerText;
      if (!contentText) return;

      window.speechSynthesis.cancel(); // 작동 중인 이전 오디오 음소거 처리
      const utterance = new SpeechSynthesisUtterance(contentText);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0; // 배속 제어
      window.speechSynthesis.speak(utterance);
    };

    // 데이터 화면에 렌더링 그리기
    function renderData(data) {
      dataList.innerHTML = '';

      if (!data) {
        dataList.innerHTML = '<div class="empty">아직 발급받은 AI 경영 리포트 히스토리가 존재하지 않습니다.</div>';
        return;
      }

      const entries = Object.entries(data).reverse();

      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div class="item-header">
            <p class="item-title">📋 경영 안건: ${escapeHTML(item.title || '')}</p>
            <button class="tts-btn" onclick="speakReport('${id}')">🔊 음성 리포트 듣기 (TTS)</button>
          </div>
          <p class="item-content" id="content-text-${id}">${escapeHTML(item.content || '')}</p>
          <div class="item-footer">
            <div class="item-date">리포트 발급 일시: ${item.createdAt || '-'}</div>
            <div class="item-actions">
              <button class="delete-btn" onclick="deleteData('${id}')">기록 삭제</button>
            </div>
          </div>
        `;

        dataList.appendChild(div);
      });
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use':
          return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email':
          return '이메일 형식이 올바르지 않습니다.';
        case 'auth/weak-password':
          return '비밀번호가 너무 약합니다. 6자리 이상으로 입력해주세요.';
        case 'auth/user-not-found':
          return '가입되지 않은 이메일입니다.';
        case 'auth/wrong-password':
          return '비밀번호가 올바르지 않습니다.';
        case 'auth/invalid-credential':
          return '이메일 또는 비밀번호가 올바르지 않습니다.';
        case 'auth/network-request-failed':
          return '네트워크 연결을 확인해주세요.';
        default:
          return `오류가 발생했습니다: ${code}`;
      }
    }

    // 엔터키 제어 필터링 단축키
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;

      const activeId = document.activeElement.id;

      if (activeId === 'emailInput' || activeId === 'passwordInput') {
        loginBtn.click();
      }
    });
  </script>
</body>
</html>
