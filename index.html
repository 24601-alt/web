<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizMate - AI 경영 어드바이저</title>
  <style>
    /* 🌿 에코(Echo)의 아이덴티티와 미니멀한 UI 요소를 BizMate에 완벽 이식 */
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      background: #EAEAE4; /* 에코의 시그니처 시멘트/베이지 톤 배경 */
      font-family: sans-serif; 
      color: #2C362B; /* 차분한 다크 그린 차콜 */
    }

    .container { 
      width: min(960px, 94%); 
      margin: 50px auto; 
      background: #F9F9F6; /* 에코의 미색(Off-white) 컨테이너 */
      border-radius: 20px; 
      padding: 40px; 
      box-shadow: 0 20px 40px rgba(44, 54, 43, 0.08); 
    }

    h1 { 
      text-align: center; 
      color: #536954; /* 에코 메인 포인트 그린 */
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #2C362B;
    }

    .subtitle {
      text-align: center; 
      color: #7A8579; 
      margin-bottom: 30px;
      font-size: 14px;
    }

    .auth-box { 
      max-width: 400px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 16px; 
      border: 1px solid #D3CDAD; 
    }

    input, select, textarea { 
      height: 48px; 
      padding: 0 16px; 
      border: 1px solid #D3CDAD; 
      border-radius: 10px; 
      width: 100%; 
      font-family: sans-serif;
      font-size: 14px;
    }

    textarea { 
      min-height: 120px; 
      padding: 16px; 
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #536954;
      box-shadow: 0 0 0 3px rgba(83, 105, 84, 0.15);
    }

    button { 
      border: none; 
      border-radius: 10px; 
      height: 48px; 
      background: #536954; 
      color: white; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px;
      width: 100%; 
      margin-top: 5px; 
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.9;
    }

    .login-btn {
      background: #536954;
      color: white;
    }

    .signup-btn {
      background: #D3CDAD; 
      color: #2C362B;
    }

    .logout-btn {
      width: 90px; 
      height: 35px; 
      background: #7A8579; 
      margin: 0;
      font-size: 13px;
    }

    .add-btn {
      background: #536954;
      color: white;
      height: auto;
      padding: 15px;
      font-size: 15px;
    }

    .refresh-btn {
      background: #7A8579;
      color: white;
      margin-bottom: 20px;
      width: auto;
      padding: 0 20px;
    }

    .tts-btn {
      background: #D3CDAD; 
      color: #2C362B;
      height: 36px;
      font-size: 13px;
      width: auto;
      padding: 0 14px;
      margin: 0;
    }

    .delete-btn {
      background: #7A8579;
      color: white;
      height: 34px;
      font-size: 13px;
      width: auto;
      padding: 0 12px;
      margin: 0;
    }

    .form-box {
      background: #ffffff; 
      padding: 30px; 
      border-radius: 16px; 
      border: 1px solid rgba(211, 205, 173, 0.4); 
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 24px; 
      background: #EAEAE4; 
      border-radius: 12px; 
      margin-bottom: 25px; 
    }

    .user-info {
      font-size: 14px;
      font-weight: bold;
    }

    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: #7A8579;
      font-size: 14px;
      text-align: center;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 에코의 깔끔한 .item 디자인 속성 베이스 */
    .item { 
      padding: 20px; 
      background: #fff; 
      border: 1px solid #D3CDAD; 
      margin-bottom: 10px; 
      border-radius: 12px; 
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #D3CDAD;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .item-title {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #2C362B;
    }

    /* 에코의 .response-box 스타일을 가독성용으로 차용 */
    .item-content {
      margin: 0 0 14px 0; 
      padding: 16px; 
      background: #F9F9F6; 
      border-left: 4px solid #536954; 
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-date {
      font-size: 12px;
      color: #7A8579;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #7A8579;
      background: #ffffff;
      border: 1px dashed #D3CDAD;
      border-radius: 12px;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      max-width: 400px;
      margin: 20px auto 0;
      padding: 15px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px dashed #7A8579;
      color: #7A8579;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BizMate</h1>
    <div class="subtitle">나만의 경영 어드바이저 & 컨설팅 관리 히스토리</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>경영인 로그인</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>

      <div class="notice">
        처음 사용하는 이메일은 회원가입을 먼저 누르세요.<br />
        이미 가입한 이메일은 로그인 버튼을 누르면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">
          접속 계정: <span id="userEmail"></span>님
        </div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="form-box">
        <h2>💡 새로운 경영 컨설팅 요청</h2>
        <input id="titleInput" type="text" placeholder="고민 한 줄 요약 (예: 원자재 인상 대응 전략)" />
        <textarea id="contentInput" placeholder="AI 분석관에게 전달할 세부 경영 상황을 입력하세요..."></textarea>
        <button class="add-btn" id="addBtn">AI 컨설팅 리포트 생성 및 저장</button>
      </div>

      <button class="refresh-btn" id="refreshBtn">히스토리 불러오기</button>
      <div id="status" class="status"></div>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onValue,
      off
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 지정해주신 프로젝트의 Firebase 정보 셋팅
    const firebaseConfig = {
  apiKey: "AIzaSyA4T6HhnvZsesbGco9rzhprUz2AbG8NnRs",
  authDomain: "project-dcdba.firebaseapp.com",
  databaseURL: "https://project-dcdba-default-rtdb.firebaseio.com",
  projectId: "project-dcdba",
  storageBucket: "project-dcdba.firebasestorage.app",
  messagingSenderId: "572244909257",
  appId: "1:572244909257:web:cd9b3fb67c4697dfac4118",
  measurementId: "G-JTBN1WZELW"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Apps Script 웹앱 배포 URL 주소
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5m0WTzUYmoWctsNb0CZzkdgo6lHHRC_c3LeaSFOBUpttWvfAUYPfztbN3-WSW24d4/exec";

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getEmailAndPassword() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return null;
      }
      if (password.length < 6) {
        alert('비밀번호는 6자리 이상이어야 합니다.');
        return null;
      }
      return { email, password };
    }

    // 회원가입 이벤트
    signupBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await createUserWithEmailAndPassword(auth, account.email, account.password);
        alert('회원가입이 완료되었습니다.');
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    // 로그인 이벤트
    loginBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await signInWithEmailAndPassword(auth, account.email, account.password);
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    // 로그아웃 이벤트
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert('로그아웃에 실패했습니다.');
      }
    });

    // 유저 상태 감지 감시자
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        showMainPage(user);
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        showAuthPage();
        stopRealtimeDataListener();
      }
    });

    function showMainPage(user) {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      userEmail.textContent = user.email;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showAuthPage() {
      authSection.classList.remove('hidden');
      mainSection.classList.add('hidden');
      userEmail.textContent = '';
      dataList.innerHTML = '';
    }

    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('경영 데이터 분석 기록을 불러오는 중입니다...');
      currentItemsRef = ref(database, `users/${uid}/items`);

      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        setStatus('경영 히스토리가 실시간으로 동기화되었습니다.');
      }, (error) => {
        console.error(error);
        setStatus('데이터 동기화 실패. 파이어베이스 권한을 확인하세요.');
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    addBtn.addEventListener('click', generateAIAndSaveData);
    refreshBtn.addEventListener('click', () => {
      if (currentUser) {
        startRealtimeDataListener(currentUser.uid);
      }
    });

    async function generateAIAndSaveData() {
      if (!currentUser) {
        alert('로그인이 필요합니다.');
        return;
      }

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title || !content) {
        alert('제목과 질문하실 경영 상황 내용을 모두 입력해주세요.');
        return;
      }

      addBtn.innerText = "사수가 답변을 생각하는 중...";
      addBtn.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ 
            prompt: `당신은 유능한 대기업 최고경영자(CEO)이자 비즈니스 컨설턴트입니다. 다음 상황에 대해 실행 가능한 핵심 경영 전략과 해결책을 구체적으로 답변해 주세요. \n[주제]: ${title} \n[상황 상황]: ${content}` 
          })
        });
        
        const data = await response.json();
        const aiResponseText = data.text || "AI 분석 결과를 가져오는 데 실패했습니다.";

        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);

        await set(newItemRef, {
          title: title,
          content: aiResponseText, 
          createdAt: new Date().toLocaleString('ko-KR')
        });

        titleInput.value = '';
        contentInput.value = '';
        alert('AI 컨설팅 리포트 발급 및 히스토리 저장이 완료되었습니다!');
      } catch (error) {
        console.error(error);
        alert('AI 연동 처리 중 문제가 발생했습니다. Apps Script 주소 및 세팅을 점검하세요.');
      } finally {
        addBtn.innerText = "AI 컨설팅 리포트 생성 및 저장";
        addBtn.disabled = false;
      }
    }

    window.deleteData = async function(id) {
      if (!currentUser) return;
      const isConfirmed = confirm('작성된 비즈니스 리포트를 히스토리에서 정말 삭제하시겠습니까?');
      if (!isConfirmed) return;

      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (error) {
        console.error(error);
        alert('리포트 삭제에 실패했습니다.');
      }
    };

    window.speakReport = function(id) {
      const contentText = document.getElementById(`content-text-${id}`).innerText;
      if (!contentText) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(contentText);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    };

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div class="empty">아직 발급받은 AI 경영 리포트 히스토리가 존재하지 않습니다.</div>';
        return;
      }

      const entries = Object.entries(data).reverse();
      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div class="item-header">
            <p class="item-title">📋 경영 안건: ${escapeHTML(item.title || '')}</p>
            <button class="tts-btn" onclick="speakReport('${id}')">🔊 음성 리포트 듣기</button>
          </div>
          <p class="item-content" id="content-text-${id}">${escapeHTML(item.content || '')}</p>
          <div class="item-footer">
            <div class="item-date">📅 발급 일시: ${item.createdAt || '-'}</div>
            <button class="delete-btn" onclick="deleteData('${id}')">기록 삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email': return '이메일 형식이 올바르지 않습니다.';
        case 'auth/weak-password': return '비밀번호가 너무 약합니다. 6자리 이상으로 입력해주세요.';
        case 'auth/user-not-found': return '가입되지 않은 이메일입니다.';
        case 'auth/wrong-password': return '비밀번호가 올바르지 않습니다.';
        case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
        case 'auth/network-request-failed': return '네트워크 연결을 확인해주세요.';
        default: return `오류가 발생했습니다: ${code}`;
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;
      const activeId = document.activeElement.id;
      if (activeId === 'emailInput' || activeId === 'passwordInput') {
        loginBtn.click();
      }
    });
  </script>
</body>
</html>
