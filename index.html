<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizMate - AI 경영 어드바이저</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="auth-container" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">BizMate</h1>
        <p class="text-gray-500 mb-6">스마트한 경영 의사결정을 위한 AI 파트너</p>
        
        <div class="space-y-4">
            <input type="email" id="email" placeholder="이메일 주소" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="password" placeholder="비밀번호" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex space-x-2">
                <button onclick="signUp()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">회원가입</button>
                <button onclick="signIn()" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">로그인</button>
            </div>
        </div>
    </div>

    <div id="main-container" class="hidden bg-white p-8 rounded-xl shadow-md w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">BizMate 경영 분석실</h1>
                <p id="user-info" class="text-sm text-gray-500"></p>
            </div>
            <button onclick="signOutUser()" class="text-sm bg-red-100 text-red-600 px-3 py-1 rounded-md hover:bg-red-200">로그아웃</button>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">현재 기업의 경영 고민이나 상황을 입력하세요</label>
            <textarea id="business-query" rows="4" placeholder="예시: 최근 원자재 가격 상승으로 인해 제조 원가가 15% 상승했습니다. 브랜드 이미지를 타격 주지 않으면서 수익성을 개선할 수 있는 경영 전략을 제안해줘." 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <button onclick="analyzeBusiness()" id="submit-btn" class="w-full mt-3 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                AI 경영 전략 분석 요청
            </button>
        </div>

        <div id="result-box" class="hidden border-t pt-6">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-bold text-gray-800">AI 컨설팅 리포트</h3>
                <button onclick="speakText()" class="flex items-center space-x-1 text-sm bg-green-100 text-green-700 px-3 py-1 rounded-md hover:bg-green-200">
                    🔊 음성으로 듣기 (TTS)
                </button>
            </div>
            <div id="ai-response" class="bg-gray-50 p-4 rounded-lg text-gray-700 whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. 파이어베이스 연결 설정 (본인 정보 입력)
        const firebaseConfig = {
            apiKey: "AIzaSyA4T6HhnvZsesbGco9rzhprUz2AbG8NnRs",
            authDomain: "project-dcdba.firebaseapp.com",
            projectId: "project-dcdba",
            storageBucket: "project-dcdba.firebasestorage.app",
            messagingSenderId: "572244909257",
            appId: "1:572244909257:web:cd9b3fb67c4697dfac4118"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 2. Apps Script 주소 설정 (안전한 중계 주소)
        const APPS_SCRIPT_URL = "https://script.google.com/home";

        // [기능 A] 회원가입 및 로그인 관리
        window.signUp = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("회원가입이 완료되었습니다!");
            } catch (error) {
                alert("회원가입 실패: " + error.message);
            }
        };

        window.signIn = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("로그인 실패: " + error.message);
            }
        };

        window.signOutUser = async () => {
            await signOut(auth);
        };

        // 로그인 상태에 따른 화면 전환 규칙
        onAuthStateChanged(auth, (user) => {
            const authContainer = document.getElementById('auth-container');
            const mainContainer = document.getElementById('main-container');
            const userInfo = document.getElementById('user-info');

            if (user) {
                authContainer.classList.add('hidden');
                mainContainer.classList.remove('hidden');
                userInfo.innerText = `${user.email} 경영인 로그인 중`;
            } else {
                authContainer.classList.remove('hidden');
                mainContainer.classList.add('hidden');
            }
        });

        // [기능 B] AI 연동 (Apps Script 호출) 및 데이터 저장 (Firestore)
        window.analyzeBusiness = async () => {
            const query = document.getElementById('business-query').value;
            const submitBtn = document.getElementById('submit-btn');
            const aiResponseDiv = document.getElementById('ai-response');
            const resultBox = document.getElementById('result-box');

            if (!query.trim()) return alert("경영 고민 내용을 입력해주세요.");

            submitBtn.innerText = "AI가 전략을 분석 중입니다...";
            submitBtn.disabled = true;

            try {
                // Apps Script로 요청 전송 (보안 유지)
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ prompt: "당신은 전문 경영 컨설턴트입니다. 다음 상황에 대한 구체적인 경영 전략을 제안해주세요: " + query })
                });
                const data = await response.json();
                const aiText = data.text || "분석 결과를 가져오지 못했습니다.";

                // 결과 화면 표시
                aiResponseDiv.innerText = aiText;
                resultBox.classList.remove('hidden');

                // 파이어베이스 데이터베이스(Firestore)에 상담 기록 누적 저장
                const user = auth.currentUser;
                if (user) {
                    await addDoc(collection(db, "management_consulting"), {
                        uid: user.uid,
                        email: user.email,
                        query: query,
                        response: aiText,
                        timestamp: new Date()
                    });
                }

            } catch (error) {
                console.error(error);
                alert("분석 중 오류가 발생했습니다. Apps Script 설정을 확인해 주세요.");
            } finally {
                submitBtn.innerText = "AI 경영 전략 분석 요청";
                submitBtn.disabled = false;
            }
        };

        // [기능 C] 브라우저 내장 TTS 기능 실행
        window.speakText = () => {
            const text = document.getElementById('ai-response').innerText;
            if (!text) return;

            window.speechSynthesis.cancel(); // 현재 읽고 있는 게 있다면 중지
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ko-KR';
            speech.rate = 1.0;
            window.speechSynthesis.speak(speech);
        };
    </script>
</body>
</html>
