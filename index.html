<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 경영 컨설턴트</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#0a4d8c;
}

button{
    background:#0a4d8c;
    color:white;
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

textarea{
    width:100%;
    height:150px;
    padding:10px;
    font-size:16px;
    margin-top:15px;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#eef6ff;
    border-radius:10px;
    white-space:pre-wrap;
    min-height:100px;
}

#records{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 AI 경영 컨설턴트</h1>

<p>
기업 운영 상황을 입력하면 AI가 경영 전략을 제안합니다.
</p>

<button onclick="login()">Google 로그인</button>
<button onclick="logout()">로그아웃</button>

<p id="userInfo">로그인 안됨</p>

<textarea
id="prompt"
placeholder="예: 우리 카페의 매출이 감소하고 있습니다.">
</textarea>

<br>

<button onclick="generateAdvice()">
AI 분석 받기
</button>

<button onclick="speakResult()">
🔊 음성 읽기
</button>

<div id="result"></div>

<h2>상담 기록</h2>

<div id="records"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ======================
// Firebase 설정
// ======================

const firebaseConfig = {

apiKey: "여기에_FIREBASE_APIKEY",

authDomain: "여기에.firebaseapp.com",

projectId: "여기에",

storageBucket: "여기에.appspot.com",

messagingSenderId: "123456789",

appId: "여기에"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


// ======================
// 로그인
// ======================

window.login = async () => {

try{

const result =
await signInWithPopup(auth, provider);

document.getElementById("userInfo").innerText =
"로그인 : " + result.user.displayName;

}catch(error){

alert(error.message);

}

};


// ======================
// 로그아웃
// ======================

window.logout = async () => {

await signOut(auth);

document.getElementById("userInfo").innerText =
"로그아웃됨";

};


// ======================
// 로그인 상태 확인
// ======================

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("userInfo").innerText =
"로그인 : " + user.displayName;

loadRecords();

}

});


// ======================
// Gemini AI
// ======================

window.generateAdvice = async () => {

try{

const prompt =
document.getElementById("prompt").value;

if(!prompt.trim()){

alert("내용을 입력하세요.");

return;

}

const GEMINI_API_KEY =
"여기에_본인_API키";

document.getElementById("result").innerText =
"AI 분석 중...";

const response = await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:
`당신은 전문 경영 컨설턴트입니다.

다음 상황을 분석하고

1. 문제 원인
2. 해결 방안
3. 마케팅 전략
4. 기대 효과

를 제시하세요.

${prompt}`
}
]
}
]

})

}

);

const data = await response.json();

console.log(data);

if(!response.ok){

alert(
"Gemini 오류:\n" +
JSON.stringify(data,null,2)
);

document.getElementById("result").innerText =
"AI 호출 실패";

return;

}

const text =
data.candidates?.[0]?.content?.parts?.[0]?.text;

if(!text){

alert("AI 응답 없음");

return;

}

document.getElementById("result").innerText =
text;


// Firestore 저장

await addDoc(
collection(db,"consulting"),
{
question:prompt,
answer:text,
createdAt:new Date()
}
);

loadRecords();

}catch(error){

console.error(error);

alert(error.message);

}

};


// ======================
// Firestore 기록 불러오기
// ======================

window.loadRecords = async () => {

try{

const q =
query(
collection(db,"consulting")
);

const snapshot =
await getDocs(q);

let html = "";

snapshot.forEach((doc)=>{

const d = doc.data();

html += `
<div style="margin-bottom:15px;">
<b>질문</b><br>
${d.question}
<hr>
</div>
`;

});

document.getElementById("records").innerHTML =
html;

}catch(error){

console.log(error);

}

};


// ======================
// TTS
// ======================

window.speakResult = () => {

const text =
document.getElementById("result").innerText;

if(!text){

alert("먼저 AI 분석을 실행하세요.");

return;

}

const utter =
new SpeechSynthesisUtterance(text);

utter.lang = "ko-KR";

speechSynthesis.speak(utter);

};

</script>

</body>
</html>
