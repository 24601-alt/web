<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 경영 컨설턴트</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#0a4d8c;
}

textarea{
width:100%;
height:120px;
padding:10px;
}

button{
padding:10px 20px;
margin:5px;
background:#0a4d8c;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:#eef6ff;
border-radius:10px;
white-space:pre-wrap;
}

#history{
margin-top:20px;
background:#fafafa;
padding:15px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 AI 경영 컨설턴트</h1>

<p>
기업 운영 상황을 입력하면 AI가 경영 전략을 제안합니다.
</p>

<button onclick="login()">Google 로그인</button>
<button onclick="logout()">로그아웃</button>

<p id="userInfo"></p>

<textarea id="prompt"
placeholder="예: 우리 카페는 매출이 감소하고 있습니다."></textarea>

<br>

<button onclick="generateAdvice()">
AI 분석 받기
</button>

<button onclick="speakResult()">
🔊 음성 읽기
</button>

<div id="result"></div>

<div id="history">
<h3>상담 기록</h3>
<div id="records"></div>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo,
",

authDomain:"여기에_AUTH_DOMAIN",

projectId:"여기에_PROJECT_ID",

storageBucket:"여기에_STORAGE",

messagingSenderId:"여기에_ID",

appId:"여기에_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

window.login = async ()=>{

const result = await signInWithPopup(auth,provider);

document.getElementById("userInfo").innerText=
"로그인 : "+result.user.displayName;

loadRecords();
}

window.logout = async ()=>{

await signOut(auth);

document.getElementById("userInfo").innerText=
"로그아웃됨";
}

window.generateAdvice = async ()=>{

const prompt =
document.getElementById("prompt").value;

const GEMINI_API_KEY =
"여기에_발급받은_API_KEY";

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:
`당신은 경영 컨설턴트입니다.
다음 상황에 대한 해결책을 제안하세요.

${prompt}`
}
]
}
]
})
}
);

const data = await response.json();

const text =
data.candidates[0].content.parts[0].text;

document.getElementById("result").innerText =
text;

await addDoc(
collection(db,"consulting"),
{
question:prompt,
answer:text,
time:new Date().toLocaleString()
}
);

loadRecords();
}

window.loadRecords = async ()=>{

const snapshot =
await getDocs(collection(db,"consulting"));

let html="";

snapshot.forEach(doc=>{

const d=doc.data();

html+=`
<div>
<b>${d.time}</b><br>
${d.question}<hr>
</div>
`;
});

document.getElementById("records").innerHTML=
html;
}

window.speakResult = ()=>{

const text =
document.getElementById("result").innerText;

const utter =
new SpeechSynthesisUtterance(text);

utter.lang="ko-KR";

speechSynthesis.speak(utter);
}

</script>

</body>
</html>
